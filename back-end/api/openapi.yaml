openapi: 3.0.3
info:
  title: Boraquest API
  version: 0.2.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /health:
    get:
      summary: Service health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      summary: Sign in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; use `token` as a Bearer token (valid for 24 hours)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /rules:
    get:
      summary: List the rules of the caller's guild, oldest first
      operationId: listRules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The guild's rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a rule in the caller's guild
      description: A guild can hold at most 40 rules at the same time.
      operationId: createRule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleRequest"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: The guild already holds 40 rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get one rule of the caller's guild
      operationId: getRule
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      summary: Replace the editable fields of a rule
      description: Any member of the rule's guild may update it. `id` and `createdBy` never change.
      operationId: updateRule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleRequest"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a rule of the caller's guild
      operationId: deleteRule
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Rule deleted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /prizes:
    get:
      summary: Get the week and month prizes of the caller's guild
      operationId: getPrizes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >-
            The guild's prizes. `updatedAt` is the zero time if no prize has
            ever been set for this guild.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prizes"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /prizes/week:
    put:
      summary: Set the week prize of the caller's guild
      description: Any member of the guild may update it. An empty string is valid.
      operationId: setWeekPrize
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPrizeRequest"
      responses:
        "200":
          description: The guild's prizes, with week updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prizes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /prizes/month:
    put:
      summary: Set the month prize of the caller's guild
      description: Any member of the guild may update it. An empty string is valid.
      operationId: setMonthPrize
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPrizeRequest"
      responses:
        "200":
          description: The guild's prizes, with month updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prizes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /entries:
    get:
      summary: List the caller's entries for a period
      operationId: listEntries
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [today, week]
      responses:
        "200":
          description: The caller's entries, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Log an entry for a guild member
      description: >-
        A `sum`-type rule can only be logged by the member themselves;
        a `decrease`-type rule may be logged against any guild member.
      operationId: createEntry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryRequest"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: A sum-type entry already exists for that rule/member/period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Remove the caller's own sum-type entry, same day only
      operationId: deleteEntry
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Entry removed
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /guild/members:
    get:
      summary: List the members of the caller's guild
      operationId: listGuildMembers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The guild's members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildMemberList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /scoreboard:
    get:
      summary: List the caller's guild's ranked standings for a period
      operationId: getScoreboard
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [week, month]
      responses:
        "200":
          description: >-
            One row per member of the caller's guild, sorted by points
            descending, ties broken by tasks completed then member id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scoreboard"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: >-
        Error. 400 invalid body or field, 401 missing/invalid token or bad credentials,
        403 caller belongs to no guild, 404 rule not found in the caller's guild.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthResponse:
      type: object
      required: [status, version, checkedAt]
      properties:
        status:
          type: string
          enum: [up, down]
        version:
          type: string
        checkedAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
    RuleRequest:
      type: object
      required: [name, frequency, scoreType, score]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          description: Trimmed before validation
        frequency:
          type: string
          enum: [daily, weekly]
        scoreType:
          type: string
          enum: [sum, decrease]
          description: "`sum` adds `score` points, `decrease` removes them"
        score:
          type: integer
          minimum: 1
          maximum: 100
    Rule:
      allOf:
        - $ref: "#/components/schemas/RuleRequest"
        - type: object
          required: [id, createdBy, createdAt, updatedAt]
          properties:
            id:
              type: string
            createdBy:
              type: string
              description: Id of the user who created the rule
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    RuleList:
      type: object
      required: [rules, limit]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
        limit:
          type: integer
          description: Maximum number of rules a guild can hold
          example: 40
    SetPrizeRequest:
      type: object
      properties:
        text:
          type: string
          maxLength: 60
          description: Trimmed before validation; empty string is valid
    Prizes:
      type: object
      required: [week, month, updatedAt]
      properties:
        week:
          type: string
          maxLength: 60
        month:
          type: string
          maxLength: 60
        updatedAt:
          type: string
          format: date-time
          description: Zero time if no prize has ever been set for this guild
    EntryRequest:
      type: object
      required: [ruleId, memberId]
      properties:
        ruleId:
          type: string
        memberId:
          type: string
          description: Must belong to the caller's guild
    Entry:
      allOf:
        - $ref: "#/components/schemas/EntryRequest"
        - type: object
          required: [id, ruleName, scoreType, points, loggedBy, occurredOn, createdAt]
          properties:
            id:
              type: string
            ruleName:
              type: string
              description: Snapshot of the rule's name at creation time
            scoreType:
              type: string
              enum: [sum, decrease]
              description: Snapshot of the rule's scoreType at creation time
            points:
              type: integer
              description: Signed; positive for sum, negative for decrease
            loggedBy:
              type: string
              description: Id of the user who recorded the entry
            occurredOn:
              type: string
              format: date
            createdAt:
              type: string
              format: date-time
    EntryList:
      type: object
      required: [entries, from, to, today]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        today:
          type: string
          format: date
    GuildMember:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    GuildMemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/GuildMember"
    Standing:
      type: object
      required: [memberId, points, completed]
      properties:
        memberId:
          type: string
        points:
          type: integer
          description: Sum of this member's entries' points in the period; may be negative
        completed:
          type: integer
          description: Count of this member's sum-type entries in the period
    Scoreboard:
      type: object
      required: [standings, from, to, today]
      properties:
        standings:
          type: array
          items:
            $ref: "#/components/schemas/Standing"
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        today:
          type: string
          format: date
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
