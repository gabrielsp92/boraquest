openapi: 3.0.3
info:
  title: Boraquest API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /health:
    get:
      summary: Service health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, version, checkedAt]
      properties:
        status:
          type: string
          enum: [up, down]
        version:
          type: string
        checkedAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
