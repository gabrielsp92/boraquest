# Local PostgreSQL for development: `make db-up` / `make db-down`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: boraquest
      POSTGRES_PASSWORD: boraquest
      POSTGRES_DB: boraquest
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boraquest -d boraquest"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
