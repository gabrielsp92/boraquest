<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>FluxoAuditoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0}body{background:var(--ground);color:var(--ink);font:700 17px/24px var(--font-body)}body{background:var(--surface-sunken)}.stage{display:flex;gap:32px;padding:32px;width:max-content}figure{margin:0}figcaption{font:800 15px/20px var(--font-body);color:var(--ink);margin-top:12px;text-align:center}.phone{border-radius:40px;overflow:hidden;box-shadow:0 0 0 2px var(--line)}</style></head>
<body>
<div class="stage"><figure><div class="phone"><div class="bq-screen "><div class="bq-body"><header class="bq-topbar"><div><h1 class="bq-title">Auditoria</h1></div><button class="bq-iconbtn" aria-label="Fechar"><svg class="bq-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header><div class="bq-banner"><span class="bq-avatar "><svg viewBox="0 0 64 64" role="img" aria-label="Lia"><circle cx="32" cy="34" r="28" fill="#ff8a65"/><circle cx="9" cy="14" r="8" fill="#2b2140"/><circle cx="55" cy="14" r="8" fill="#2b2140"/><circle cx="24" cy="30" r="3" fill="#2b2140"/><circle cx="40" cy="30" r="3" fill="#2b2140"/><path d="M24 40c3 5 13 5 16 0" fill="none" stroke="#2b2140" stroke-width="3" stroke-linecap="round"/></svg></span><div><p class="bq-text">Lia pediu uma auditoria</p><p class="bq-caption">Mostre que você cumpriu as quests da semana.</p></div></div><div class="bq-list" style="gap:12px"><div class="bq-proof"><div class="bq-row"><div class="bq-grow"><p class="bq-text">Caminhar 30 minutos</p><p class="bq-caption">Terça</p></div><span class="bq-points bq-points--gain">+15</span></div><div class="bq-row"><span class="bq-thumb" role="img" aria-label="Foto de prova"><svg class="bq-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 16l4.5-4.5 4 4 2.5-2.5 5 5"/><circle cx="15.5" cy="9.5" r="1.2"/></svg></span><p class="bq-caption">Foto enviada</p></div></div><div class="bq-proof"><div class="bq-row"><div class="bq-grow"><p class="bq-text">Beber 2 L de água</p><p class="bq-caption">Quarta</p></div><span class="bq-points bq-points--gain">+10</span></div><p class="bq-note">Enchi a garrafa azul duas vezes.</p></div><div class="bq-proof"><div class="bq-row"><div class="bq-grow"><p class="bq-text">Ler 20 minutos</p><p class="bq-caption">Quarta</p></div><span class="bq-points bq-points--gain">+10</span></div><div class="bq-row"><button class="bq-btn bq-btn--small bq-grow"><svg class="bq-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Foto</button><button class="bq-btn bq-btn--small bq-grow"><svg class="bq-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg>Explicar</button></div></div></div><div class="bq-grow"></div><p class="bq-caption" style="text-align:center">2 de 3 quests com prova</p><button class="bq-btn bq-btn--block">Enviar provas</button></div></div></div><figcaption>Quem foi auditado envia as provas</figcaption></figure><figure><div class="phone"><div class="bq-screen "><div class="bq-body"><header class="bq-topbar"><div><h1 class="bq-title">Provas do Caio</h1></div><button class="bq-iconbtn" aria-label="Fechar"><svg class="bq-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header><div class="bq-banner"><span class="bq-avatar "><svg viewBox="0 0 64 64" role="img" aria-label="Caio"><circle cx="32" cy="34" r="28" fill="#7ddcb5"/><path d="M10 22c2-18 42-18 44 0z" fill="#2b2140"/><rect x="40" y="18" width="22" height="6" rx="3" fill="#2b2140"/><circle cx="24" cy="33" r="3" fill="#2b2140"/><circle cx="40" cy="33" r="3" fill="#2b2140"/><path d="M24 43c3 5 13 5 16 0" fill="none" stroke="#2b2140" stroke-width="3" stroke-linecap="round"/></svg></span><div><p class="bq-text">Caio enviou as provas</p><p class="bq-caption">Dê uma olhada e decida.</p></div></div><div class="bq-list" style="gap:12px"><div class="bq-proof"><div class="bq-row"><div class="bq-grow"><p class="bq-text">Caminhar 30 minutos</p><p class="bq-caption">Terça</p></div><span class="bq-points bq-points--gain">+15</span></div><div class="bq-row"><span class="bq-thumb" role="img" aria-label="Foto de prova"><svg class="bq-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 16l4.5-4.5 4 4 2.5-2.5 5 5"/><circle cx="15.5" cy="9.5" r="1.2"/></svg></span><p class="bq-caption">Toque para ampliar</p></div></div><div class="bq-proof"><div class="bq-row"><div class="bq-grow"><p class="bq-text">Beber 2 L de água</p><p class="bq-caption">Quarta</p></div><span class="bq-points bq-points--gain">+10</span></div><p class="bq-note">Enchi a garrafa azul duas vezes.</p></div><div class="bq-proof"><div class="bq-row"><div class="bq-grow"><p class="bq-text">Ler 20 minutos</p><p class="bq-caption">Quarta</p></div><span class="bq-points bq-points--gain">+10</span></div><p class="bq-note">Li o gibi novo antes de dormir.</p></div></div><div class="bq-grow"></div><div class="bq-stack"><button class="bq-btn bq-btn--block"><svg class="bq-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Aprovar</button><button class="bq-btn bq-btn--plain bq-btn--block">Reprovar</button></div><p class="bq-caption" style="text-align:center">Se reprovar, a auditoria continua pendente.</p></div></div></div><figcaption>Quem pediu aprova ou reprova</figcaption></figure></div>
</body>
</html>
