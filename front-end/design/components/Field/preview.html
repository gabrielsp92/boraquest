<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Field — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0}body{background:var(--ground);color:var(--ink);font:700 17px/24px var(--font-body)}.demo{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}</style></head>
<body>
<div class="demo"><div class="bq-stack" style="width:342px;gap:16px"><div class="bq-field"><label class="bq-label">Nome</label><input class="bq-input" value="Comer uma fruta"></div><div class="bq-field"><span class="bq-label">Frequência</span><div class="bq-seg" role="group"><button class="bq-seg__opt" aria-pressed="true">Diária</button><button class="bq-seg__opt" aria-pressed="false">Semanal</button></div></div><div class="bq-field"><span class="bq-label">Pontos</span><div class="bq-seg" role="group"><button class="bq-seg__opt" aria-pressed="true">Soma +</button><button class="bq-seg__opt" aria-pressed="false">Desconta −</button></div><div class="bq-stepper"><button class="bq-iconbtn" aria-label="Menos"><svg class="bq-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><output>+10</output><button class="bq-iconbtn" aria-label="Mais"><svg class="bq-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div></div></div></div>
